name: Weapon handling checks
on:
  push:
    branches: [fix/weapon-handling, main]
    paths:
      - 'src/**'
      - 'tests/weapon-handling.test.mjs'
      - '.github/weapon-handling.config.cjs'
      - '.github/workflows/weapon-handling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/weapon-handling.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config .github/weapon-handling.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-handling-evidence
          path: |
            test-artifacts/
            test-results/
