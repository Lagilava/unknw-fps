name: Weapon handling checks
on:
  push:
    branches: [fix/weapon-handling, fix/animation-lab, main]
    paths:
      - 'src/**'
      - 'tests/weapon-handling.test.mjs'
      - '.github/weapon-handling.config.cjs'
      - '.github/workflows/weapon-handling.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  handling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/weapon-handling.test.mjs
      - run: npm run build
      - run: google-chrome --version
      - run: npx playwright test --config .github/weapon-handling.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-handling-evidence
          path: |
            test-artifacts/
            test-results/
      - name: Save verified weapon captures for the README
        if: success() && (github.ref_name == 'fix/weapon-handling' || github.ref_name == 'fix/animation-lab')
        run: |
          mkdir -p docs/screenshots
          cp test-artifacts/handling-*.png test-artifacts/fit-*.png docs/screenshots/
          if ls test-artifacts/animation-lab-*.png >/dev/null 2>&1; then cp test-artifacts/animation-lab-*.png docs/screenshots/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh README images from verified weapon handling run"
            git push origin HEAD:${{ github.ref_name }}
          fi
