<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UNKNW · Developer Console</title>
<style>
  :root {
    --bg: #0a0f14; --panel: #101821; --panel2: #0c141c; --line: #1e2c39;
    --ink: #d6e6f2; --dim: #8aa0b2; --accent: #7cf3ff; --accent2: #ffb454;
    --good: #6ee7a8; --bad: #ff6b7d; --chip: #16222e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 232px 1fr; height: 100vh; overflow: hidden;
    transition: grid-template-columns .18s ease;
  }
  body.preview-open { grid-template-columns: 232px 1fr 420px; }
  /* Collapsed sidebar: drop the first grid column and hide the aside. */
  body.sidebar-collapsed { grid-template-columns: 0 1fr; }
  body.sidebar-collapsed.preview-open { grid-template-columns: 0 1fr 420px; }
  body.sidebar-collapsed aside { display: none; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* Small icon button used by the sidebar collapse + preview close toggles. */
  .icon-btn {
    background: var(--chip); border: 1px solid var(--line); color: var(--dim);
    border-radius: 7px; padding: 5px 9px; font-size: 13px; line-height: 1; cursor: pointer;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--accent); }

  /* Sidebar */
  aside {
    background: linear-gradient(180deg, #0c141c, #080d12);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden;
  }
  .brand { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 14px; letter-spacing: .18em; color: var(--accent); }
  .brand p { margin: 4px 0 0; font-size: 10.5px; color: var(--dim); letter-spacing: .05em; }
  nav { padding: 8px; overflow-y: auto; flex: 1; }
  nav button {
    display: flex; width: 100%; align-items: center; gap: 8px; text-align: left;
    background: none; border: 0; color: var(--dim); padding: 9px 11px; border-radius: 8px;
    cursor: pointer; font-size: 12.5px; letter-spacing: .02em;
  }
  nav button:hover { background: var(--chip); color: var(--ink); }
  nav button.active { background: rgba(124,243,255,.1); color: var(--accent); }
  nav button .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  nav button.on .dot { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .side-foot { padding: 10px; border-top: 1px solid var(--line); display: grid; gap: 6px; }

  /* Main */
  main { overflow-y: auto; padding: 0 28px 60px; }
  header.top {
    position: sticky; top: 0; z-index: 5; background: rgba(10,15,20,.92);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: 16px 0 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  header.top h2 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header.top .sub { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .section { display: none; padding-top: 18px; }
  .section.active { display: block; }

  /* Live Preview dock — persistent (not a .section), visible across every
     nav page so a developer can keep the game running while tuning params. */
  #previewDock {
    display: none; flex-direction: column; overflow: hidden;
    border-left: 1px solid var(--line); background: var(--panel2);
  }
  body.preview-open #previewDock { display: flex; }
  #previewDock .pd-head {
    padding: 12px 12px 10px; border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 8px;
  }
  #previewDock .pd-title {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #previewDock .pd-title strong { font-size: 12px; letter-spacing: .1em; color: var(--dim); }
  #previewDock .pd-status { font-size: 10.5px; color: var(--dim); }
  #previewDock .pd-status.ready { color: var(--good); }
  #previewDock .pd-toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #previewDock .pd-toolbar input[type="number"] {
    width: 52px; background: var(--chip); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 5px 6px; font-size: 11px;
  }
  #previewDock .pd-toolbar button[disabled] { opacity: .4; cursor: not-allowed; pointer-events: none; }
  #previewDock .pd-frame-wrap { flex: 1; position: relative; background: #000; }
  #previewDock iframe {
    width: 100%; height: 100%; border: 0; display: block;
  }
  #previewDock .pd-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: var(--dim); font-size: 12px; text-align: center; padding: 0 20px;
  }
  #previewToggle.on { border-color: var(--accent); color: var(--accent); }

  /* Preset bar */
  .preset-bar {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .preset-bar select, .preset-bar input { min-width: 150px; }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px 20px; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .group > h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: .08em; color: var(--accent2); text-transform: uppercase; }

  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld label { font-size: 11px; color: var(--dim); letter-spacing: .03em; display: flex; justify-content: space-between; }
  .fld label .val { color: var(--accent); font-family: ui-monospace, monospace; }
  .fld .row { display: flex; gap: 8px; align-items: center; }
  input[type=number], input[type=text], select, textarea {
    background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 7px; padding: 7px 9px; font-size: 12.5px; width: 100%;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  textarea { font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.35; resize: vertical; white-space: pre; overflow-wrap: normal; }

  button.btn {
    background: var(--chip); border: 1px solid var(--line); color: var(--ink);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; letter-spacing: .02em;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: rgba(124,243,255,.14); border-color: rgba(124,243,255,.4); color: var(--accent); }
  button.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.btn.small { padding: 5px 9px; font-size: 11px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { display: none; }
  .switch .track { width: 38px; height: 21px; border-radius: 999px; background: #223; border: 1px solid var(--line); position: relative; transition: .15s; }
  .switch .track::after { content:""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #6b7d8c; transition: .15s; }
  .switch input:checked + .track { background: rgba(110,231,168,.3); border-color: var(--good); }
  .switch input:checked + .track::after { left: 19px; background: var(--good); }

  .chip { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); color: var(--dim); }
  .chip.on { color: var(--good); border-color: var(--good); }
  .spacer { flex: 1; }
  .hint { color: var(--dim); font-size: 11.5px; margin: 0 0 14px; }
  .toast {
    position: fixed; bottom: 18px; right: 18px; background: var(--panel); border: 1px solid var(--accent);
    color: var(--accent); padding: 11px 16px; border-radius: 9px; font-size: 12.5px; z-index: 200;
    opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .toast.show { opacity: 1; transform: none; }
  .modal-bg { position: fixed; inset: 0; background: rgba(2,6,10,.7); display: none; align-items: center; justify-content: center; z-index: 150; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(560px, 92vw); max-height: 82vh; overflow: auto; }
  .modal h3 { margin: 0 0 12px; }
  .rows { display: grid; gap: 8px; }
  table.spawn { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.spawn th, table.spawn td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  table.spawn th { color: var(--dim); font-weight: 600; font-size: 10.5px; letter-spacing: .05em; }
  table.spawn input { padding: 4px 6px; text-align: center; }
  .row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>

    </div>
    <div class="pd-frame-wrap">
      <div class="pd-empty" id="pdEmpty">Click Start to boot a live game preview here.<br />Parameter edits live-apply into it — no reload.</div>
      <iframe id="pdFrame" allow="pointer-lock; fullscreen" style="display:none"></iframe>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none" />

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let store = DE.loadStore();

// Install the bundled Starter pack: create a "Starter" preset in each covered
// category. `activate` also switches those categories on (live-applied by an open
// game tab, and read on the game's next load). Idempotent — overwrites "Starter".
function installStarterPack(activate) {
  for (const cat of Object.keys(STARTER_PRESETS)) {
    if (!DE.CATEGORIES.includes(cat)) continue;
    DE.createPreset(store, cat, STARTER_PACK_NAME, STARTER_PRESETS[cat]);
    editing[cat] = STARTER_PACK_NAME;
    if (activate) DE.activatePreset(store, cat, STARTER_PACK_NAME);
  }
  persist();
}

const editing = {}; // category -> preset name currently being edited
for (const c of DE.CATEGORIES) editing[c] = store.active[c] || "Default";

// First-run seed: install + activate the Starter pack once, then remember it so
// later edits/deactivations are never clobbered. Set localStorage
// rb-dev-starter-installed = 0 (or clear it) to let it seed again.
let _starterJustSeeded = false;
try {
  if (localStorage.getItem(STARTER_INSTALLED_KEY) !== "1") {
    installStarterPack(true);
    localStorage.setItem(STARTER_INSTALLED_KEY, "1");
    _starterJustSeeded = true;
  }
} catch (_) {}

DE.saveStore(store); // publish initial resolved snapshot

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, kids = []) => {
  const n = document.createElement(tag);
  Object.assign(n, props);
  if (props.style) n.setAttribute("style", props.style);
  for (const k of [].concat(kids)) if (k != null) n.append(k);
  return n;
};
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800);
}
function persist() {
  DE.saveStore(store); // recomputes + writes ACTIVE_KEY → game tab reloads/hot-applies
  refreshNavDots();
}

// Return the config object currently being edited for a category.
function currentConfig(cat) {
  const name = editing[cat];
  if (!store.presets[cat][name]) store.presets[cat][name] = DE.defaultCategory(cat);
  return store.presets[cat][name];
}

// ─────────────────────────────────────────────────────────────────────────────
// Nav
// ─────────────────────────────────────────────────────────────────────────────
const SECTIONS = ["presets", "map", "camera", "lighting", "gameplay", "weapons", "enemies", "spawn", "player", "quality", "cutscenes", "cinematic", "debug"];
let activeSection = "presets";
function buildNav() {
  const nav = $("#nav"); nav.innerHTML = "";
  for (const s of SECTIONS) {
    const label = s === "presets" ? "Presets" : DE.CATEGORY_LABELS[s];
    const b = el("button", { className: "nav-btn", onclick: () => showSection(s) });
    b.dataset.sec = s;
    b.append(el("span", { className: "dot" }), document.createTextNode(label));
    nav.append(b);
  }
  refreshNavDots();
}
function refreshNavDots() {
  document.querySelectorAll(".nav-btn").forEach((b) => {
    const s = b.dataset.sec;
    const on = s !== "presets" && store.active[s];
    b.classList.toggle("on", !!on);
    b.classList.toggle("active", s === activeSection);
  });
}
function showSection(s) {
  activeSection = s;
  $("#secTitle").textContent = s === "presets" ? "Presets" : DE.CATEGORY_LABELS[s];
  $("#secSub").textContent = SECTION_SUB[s] || "";
  document.querySelectorAll(".section").forEach((n) => n.classList.toggle("active", n.dataset.sec === s));
  refreshNavDots();
}

// ─────────────────────────────────────────────────────────────────────────────
// Field renderers
// ─────────────────────────────────────────────────────────────────────────────
function makeField(cat, obj, key, spec, onChange) {
  const [type] = spec;
  const label = LABELS[key] || key;
  const wrap = el("div", { className: "fld" });

  if (type === "b") {
    const sw = el("label", { className: "switch" });
    const inp = el("input", { type: "checkbox", checked: !!obj[key] });
    inp.onchange = () => { obj[key] = inp.checked; onChange(); };
    sw.append(inp, el("span", { className: "track" }), el("span", { textContent: label, style: "font-size:12px" }));
    wrap.append(sw);
    return wrap;
  }
  if (type === "s") {
    const lab = el("label", {}, [label]);
    const sel = el("select");
    for (const opt of spec[1]) sel.append(el("option", { value: opt, textContent: opt, selected: obj[key] === opt }));
    sel.onchange = () => { obj[key] = sel.value; onChange(); };
    wrap.append(lab, sel);
    return wrap;
  }
  if (type === "c") {
    const lab = el("label", {}, [label]);
    const row = el("div", { className: "row" });
    const col = el("input", { type: "color", value: obj[key] || "#ffffff" });
    const txt = el("input", { type: "text", value: obj[key] || "#ffffff", style: "max-width:110px" });
    col.oninput = () => { obj[key] = col.value; txt.value = col.value; onChange(); };
    txt.onchange = () => { if (/^#[0-9a-fA-F]{6}$/.test(txt.value)) { obj[key] = txt.value; col.value = txt.value; onChange(); } };
    row.append(col, txt); wrap.append(lab, row);
    return wrap;
  }
  // numeric / integer
  const [, min, max, step] = spec;
  const lab = el("label", {}, [label]);
  const valSpan = el("span", { className: "val", textContent: fmt(obj[key]) });
  lab.append(valSpan);
  const row = el("div", { className: "row" });
  const range = el("input", { type: "range", min, max, step: type === "i" ? 1 : (step || 0.01), value: obj[key] });
  const numI = el("input", { type: "number", min, max, step: type === "i" ? 1 : (step || 0.01), value: obj[key], style: "max-width:96px" });
  const apply = (v, from) => {
    let n = parseFloat(v); if (!Number.isFinite(n)) return;
    if (type === "i") n = Math.round(n);
    obj[key] = n; valSpan.textContent = fmt(n);
    if (from !== "range") range.value = n;
    if (from !== "num") numI.value = n;
    onChange();
  };
  range.oninput = () => apply(range.value, "range");
  numI.onchange = () => apply(numI.value, "num");
  row.append(range, numI); wrap.append(lab, row);
  return wrap;
}
function fmt(v) { return typeof v === "number" ? (Number.isInteger(v) ? v : +v.toFixed(3)) : v; }

// Standard preset toolbar for a category.
function presetBar(cat) {
  const bar = el("div", { className: "preset-bar" });
  const sel = el("select");
  const rebuildOptions = () => {
    sel.innerHTML = "";
    for (const name of Object.keys(store.presets[cat]))
      sel.append(el("option", { value: name, textContent: name, selected: name === editing[cat] }));
  };
  rebuildOptions();
  sel.onchange = () => { editing[cat] = sel.value; renderSection(cat); };

  const activeSwitch = el("label", { className: "switch" });
  const actInp = el("input", { type: "checkbox", checked: store.active[cat] === editing[cat] });
  actInp.onchange = () => {
    DE.activatePreset(store, cat, actInp.checked ? editing[cat] : null);
    persist(); toast(actInp.checked ? `Activated “${editing[cat]}”` : `Deactivated ${DE.CATEGORY_LABELS[cat]}`);
  };
  activeSwitch.append(actInp, el("span", { className: "track" }), el("span", { textContent: "Active", style: "font-size:12px" }));

  const btn = (txt, cls, fn) => el("button", { className: "btn small " + (cls || ""), textContent: txt, onclick: fn });

  bar.append(
    el("span", { className: "chip", textContent: "PRESET" }), sel, activeSwitch, el("span", { className: "spacer" }),
    btn("＋ New", "", () => {
      const name = prompt("New preset name:", "Untitled");
      if (!name) return;
      DE.createPreset(store, cat, name, currentConfig(cat));
      editing[cat] = name; persist(); renderSection(cat); toast("Created “" + name + "”");
    }),
    btn("⎘ Duplicate", "", () => {
      const name = prompt("Duplicate as:", editing[cat] + " copy"); if (!name) return;
      DE.duplicatePreset(store, cat, editing[cat], name); editing[cat] = name; persist(); renderSection(cat);
    }),
    btn("✎ Rename", "", () => {
      const name = prompt("Rename to:", editing[cat]); if (!name || name === editing[cat]) return;
      DE.renamePreset(store, cat, editing[cat], name); editing[cat] = name; persist(); renderSection(cat);
    }),
    btn("⌫ Delete", "danger", () => {
      if (editing[cat] === "Default") return toast("The Default preset is protected.");
      if (!confirm("Delete preset “" + editing[cat] + "”?")) return;
      DE.deletePreset(store, cat, editing[cat]); editing[cat] = store.active[cat] || "Default"; persist(); renderSection(cat);
    }),
    btn("⭳ Copy JSON", "", async () => {
      const text = DE.exportCategoryPreset(cat, currentConfig(cat));
      try { await navigator.clipboard.writeText(text); toast("Preset JSON copied"); }
      catch { showJsonModal("Export " + DE.CATEGORY_LABELS[cat], text); }
    }),
    btn("⭱ Import", "", () => importPresetFor(cat)),
    btn("⟲ Reset section", "danger", () => {
      DE.resetCategory(store, cat); editing[cat] = "Default"; persist(); renderSection(cat); toast(DE.CATEGORY_LABELS[cat] + " reset");
    }),
  );
  bar._rebuild = rebuildOptions;
  return bar;
}

function importPresetFor(cat) {
  showJsonModal("Import " + DE.CATEGORY_LABELS[cat], "", (text) => {
    try {
      const { category, config } = DE.importCategoryPreset(text);
      if (category !== cat) return toast("That JSON is for “" + category + "”, not " + cat);
      const name = prompt("Save imported preset as:", "Imported"); if (!name) return;
      DE.createPreset(store, cat, name, config); editing[cat] = name; persist(); renderSection(cat); toast("Imported “" + name + "”");
    } catch (e) { toast("Import failed: " + e.message); }
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Per-section render
// ─────────────────────────────────────────────────────────────────────────────
function sectionHost(cat) { return $(`.section[data-sec="${cat}"]`); }

function renderSection(cat) {
  if (cat === "presets") return renderPresets();
  if (cat === "map") return renderMap();
  if (cat === "spawn") return renderSpawn();
  if (cat === "weapons") return renderGrouped("weapons", ["rifle", "shotgun", "sniper", "pistol", "smg", "lmg", "dmr", "akimbo", "flak"], GUN_FIELDS, (g) => g.toUpperCase());
  if (cat === "enemies") return renderGrouped("enemies", Object.keys(DE.DEFAULTS.enemies), ENEMY_FIELDS, (g) => g);
  return renderFlat(cat);
}

function renderFlat(cat) {
  const host = sectionHost(cat); host.innerHTML = "";
  host.append(presetBar(cat));
  const cfg = currentConfig(cat);
  const grid = el("div", { className: "field-grid" });
  for (const key of Object.keys(FIELDS[cat])) grid.append(makeField(cat, cfg, key, FIELDS[cat][key], persist));
  host.append(grid);
}

function renderGrouped(cat, groups, fieldDefs, titleFn) {
  const host = sectionHost(cat); host.innerHTML = "";
  const bar = presetBar(cat); host.append(bar);
  host.append(el("p", { className: "hint", textContent:
    cat === "weapons" ? "Each preset holds all three weapons — one master weapons preset." :
                        "Each preset holds every enemy type — one master enemy preset." }));
  const cfg = currentConfig(cat);
  for (const g of groups) {
    if (!cfg[g]) cfg[g] = DE.deepClone(DE.DEFAULTS[cat][g]);
    const box = el("div", { className: "group" });
    box.append(el("h3", { textContent: titleFn(g) }));
    const grid = el("div", { className: "field-grid" });
    for (const key of Object.keys(fieldDefs)) grid.append(makeField(cat, cfg[g], key, fieldDefs[key], persist));
    box.append(grid); host.append(box);
  }
}

// Map editor ───────────────────────────────────────────────────────────────────
function renderMap() {
  const host = sectionHost("map"); host.innerHTML = "";
  host.append(presetBar("map"));
  const cfg = currentConfig("map");
  host.append(el("p", { className: "hint", textContent:
    "Legend:  #=wall   .=open floor   +=doorway.  Every row must be the same width (≥3×3). Saving rebuilds collision, geometry, lighting placement and the minimap." }));

  const ta = el("textarea", { rows: Math.max(12, cfg.rows.length + 1), value: cfg.rows.join("\n"), spellcheck: false, style: "width:100%" });
  const status = el("div", { className: "hint", style: "margin-top:8px" });
  const validate = () => {
    const rows = ta.value.replace(/\r/g, "").split("\n").filter((r, i, a) => !(i === a.length - 1 && r === ""));
    const w = rows.length ? rows[0].length : 0;
    const ok = rows.length >= 3 && w >= 3 && rows.every((r) => r.length === w);
    status.innerHTML = ok
      ? `<span style="color:var(--good)">✓ valid — ${rows.length} rows × ${w} cols</span>`
      : `<span style="color:var(--bad)">✗ rows must all be the same width (≥3), ≥3 rows</span>`;
    return ok ? rows : null;
  };
  ta.oninput = validate;
  const cell = el("input", { type: "number", min: 1, max: 12, step: 0.5, value: cfg.cell, style: "max-width:90px" });

  const save = el("button", { className: "btn primary", textContent: "Apply map", onclick: () => {
    const rows = validate(); if (!rows) return toast("Fix the grid first");
    cfg.rows = rows; cfg.cell = parseFloat(cell.value) || 4; persist(); toast("Map applied — game tab rebuilds on reload");
  }});
  const reset = el("button", { className: "btn danger", textContent: "Load built-in map", onclick: () => {
    cfg.rows = DE.DEFAULT_MAP_ROWS.slice(); cfg.cell = 4; renderMap(); persist(); toast("Built-in map loaded");
  }});
  host.append(ta, status,
    el("div", { className: "row-flex", style: "margin-top:12px" },
      [el("span", { className: "chip", textContent: "CELL SIZE" }), cell, save, reset]));
  validate();
}

// Spawn editor ──────────────────────────────────────────────────────────────────
function renderSpawn() {
  const host = sectionHost("spawn"); host.innerHTML = "";
  host.append(presetBar("spawn"));
  const cfg = currentConfig("spawn");
  const grid = el("div", { className: "field-grid" });
  grid.append(
    makeField("spawn", cfg, "minDistance", ["n", 0, 60, 0.5], persist),
    fieldBool(cfg, "preferVisible", "Prefer visible spawns"),
    fieldBool(cfg, "useProceduralFallback", "Procedural fallback"),
  );
  host.append(grid);
  host.append(el("p", { className: "hint", textContent:
    "Manual spawn points (world X/Z). facing=radians, wave 0 = all waves, higher priority spawns first. Points inside walls are skipped at runtime. Empty list = built-in procedural spawner." }));

  const table = el("table", { className: "spawn" });
  table.append(el("thead", {}, el("tr", {}, ["#", "X", "Z", "Facing", "Radius", "Wave", "Prio", "Type", ""].map((h) => el("th", { textContent: h })))));
  const tb = el("tbody");
  const redraw = () => {
    tb.innerHTML = "";
    cfg.points.forEach((p, i) => {
      const tr = el("tr");
      const cellInp = (key, w = 70) => {
        const inp = el("input", { type: "number", value: p[key], step: key === "facing" ? 0.1 : 1, style: `max-width:${w}px` });
        inp.onchange = () => { p[key] = parseFloat(inp.value) || 0; persist(); };
        return el("td", {}, inp);
      };
      const typeInp = el("input", { type: "text", value: p.type || "", placeholder: "(any)", style: "max-width:110px" });
      typeInp.onchange = () => { p.type = typeInp.value; persist(); };
      tr.append(
        el("td", { textContent: i + 1 }),
        cellInp("x"), cellInp("z"), cellInp("facing"), cellInp("radius"), cellInp("wave", 55), cellInp("priority", 50),
        el("td", {}, typeInp),
        el("td", {}, el("button", { className: "btn small danger", textContent: "✕", onclick: () => { cfg.points.splice(i, 1); persist(); redraw(); } })),
      );
      tb.append(tr);
    });
  };
  table.append(tb);
  host.append(table);
  host.append(el("div", { className: "row-flex", style: "margin-top:12px" }, [
    el("button", { className: "btn primary", textContent: "＋ Add spawn point", onclick: () => {
      cfg.points.push({ x: 0, z: 60, facing: 0, radius: 0, wave: 0, priority: 0, type: "" }); persist(); redraw();
    }}),
    el("button", { className: "btn danger", textContent: "Clear all", onclick: () => { cfg.points = []; persist(); redraw(); } }),
  ]));
  redraw();
}
function fieldBool(obj, key, label) {
  const wrap = el("div", { className: "fld" });
  const sw = el("label", { className: "switch" });
  const inp = el("input", { type: "checkbox", checked: !!obj[key] });
  inp.onchange = () => { obj[key] = inp.checked; persist(); };
  sw.append(inp, el("span", { className: "track" }), el("span", { textContent: label, style: "font-size:12px" }));
  wrap.append(sw); return wrap;
}

// Presets (master) section ──────────────────────────────────────────────────────
function renderPresets() {
  const host = sectionHost("presets"); host.innerHTML = "";
  host.append(el("p", { className: "hint", textContent:
    "A master preset captures one preset per category and applies them as a layer. When a master is active it overrides the per-category selection for any category it specifies." }));

  // Active master selector
  const bar = el("div", { className: "preset-bar" });
  const sel = el("select");
  sel.append(el("option", { value: "", textContent: "— none —", selected: !store.activeMaster }));
  for (const name of Object.keys(store.masters)) sel.append(el("option", { value: name, textContent: name, selected: store.activeMaster === name }));
  sel.onchange = () => { DE.activateMaster(store, sel.value || null); persist(); toast(sel.value ? "Master “" + sel.value + "” active" : "Master cleared"); renderPresets(); };
  bar.append(el("span", { className: "chip", textContent: "ACTIVE MASTER" }), sel, el("span", { className: "spacer" }),
    el("button", { className: "btn small primary", textContent: "＋ Capture current as master", onclick: () => {
      const name = prompt("Master preset name:", "My Build"); if (!name) return;
      DE.captureMaster(store, name); DE.activateMaster(store, name); persist(); renderPresets(); toast("Captured master “" + name + "”");
    }}));
  host.append(bar);

  // Master detail editor
  if (store.activeMaster && store.masters[store.activeMaster]) {
    const m = store.masters[store.activeMaster];
    const box = el("div", { className: "group" });
    box.append(el("h3", { textContent: "Master: " + store.activeMaster }));
    const grid = el("div", { className: "field-grid" });
    for (const cat of DE.CATEGORIES) {
      const wrap = el("div", { className: "fld" });
      wrap.append(el("label", {}, [DE.CATEGORY_LABELS[cat]]));
      const csel = el("select");
      csel.append(el("option", { value: "", textContent: "— use per-category —", selected: !m.categories[cat] }));
      for (const pn of Object.keys(store.presets[cat])) csel.append(el("option", { value: pn, textContent: pn, selected: m.categories[cat] === pn }));
      csel.onchange = () => { m.categories[cat] = csel.value || null; persist(); };
      wrap.append(csel); grid.append(wrap);
    }
    box.append(grid);
    box.append(el("div", { className: "row-flex", style: "margin-top:12px" }, [
      el("button", { className: "btn danger", textContent: "Delete this master", onclick: () => {
        if (!confirm("Delete master “" + store.activeMaster + "”?")) return;
        DE.deleteMaster(store, store.activeMaster); persist(); renderPresets();
      }}),
    ]));
    host.append(box);
  }

  // Whole-config snapshot summary
  const summary = el("div", { className: "group" });
  summary.append(el("h3", { textContent: "Active configuration" }));
  const active = DE.resolveActive(store);
  const list = el("div", { className: "field-grid" });
  for (const cat of DE.CATEGORIES) {
    const on = active._categories.includes(cat);
    list.append(el("div", { className: "row-flex" }, [
      el("span", { className: "chip" + (on ? " on" : ""), textContent: DE.CATEGORY_LABELS[cat] }),
      el("span", { className: "hint", style: "margin:0", textContent: on ? (store.active[cat] || (store.masters[store.activeMaster]?.categories[cat]) || "—") : "built-in default" }),
    ]));
  }
  summary.append(list);
  summary.append(el("div", { className: "row-flex", style: "margin-top:14px" }, [
    el("button", { className: "btn", textContent: "⭳ Copy full config JSON", onclick: async () => {
      try { await navigator.clipboard.writeText(DE.exportStore(store)); toast("Full config copied"); }
      catch { showJsonModal("Full developer config", DE.exportStore(store)); }
    }}),
    el("button", { className: "btn danger", textContent: "Deactivate everything", onclick: () => {
      for (const c of DE.CATEGORIES) DE.activatePreset(store, c, null);
      DE.activateMaster(store, null); persist(); renderPresets(); toast("All categories back to built-in defaults");
    }}),
  ]));
  host.append(summary);
}

function showJsonModal(title, text, onImport) {
  const m = $("#modal"); m.innerHTML = "";
  m.append(el("h3", { textContent: title }));
  const ta = el("textarea", { rows: 16, value: text, spellcheck: false, style: "width:100%" });
  m.append(ta);
  const actions = el("div", { className: "row-flex", style: "margin-top:14px;justify-content:flex-end" });
  if (onImport) actions.append(el("button", { className: "btn primary", textContent: "Import", onclick: () => { onImport(ta.value); closeModal(); } }));
  else actions.append(el("button", { className: "btn primary", textContent: "Copy", onclick: async () => { try { await navigator.clipboard.writeText(ta.value); toast("Copied"); } catch {} } }));
  actions.append(el("button", { className: "btn", textContent: "Close", onclick: closeModal }));
  m.append(actions);
  $("#modalBg").classList.add("show");
}
function closeModal() { $("#modalBg").classList.remove("show"); }
$("#modalBg").onclick = (e) => { if (e.target === $("#modalBg")) closeModal(); };

$("#importAll").onclick = () => {
  showJsonModal("Import full developer store", "", (text) => {
    try { store = DE.importStore(text); for (const c of DE.CATEGORIES) editing[c] = store.active[c] || "Default"; persist(); buildAll(); toast("Store imported"); }
    catch (e) { toast("Import failed: " + e.message); }
  });
};
$("#resetAll").onclick = () => {
  if (!confirm("Reset the ENTIRE developer configuration to defaults? This clears all presets.")) return;
  store = DE.createDefaultStore(); for (const c of DE.CATEGORIES) editing[c] = "Default"; persist(); buildAll(); toast("Everything reset");
};

// ─────────────────────────────────────────────────────────────────────────────
// Live Preview dock — embeds the actual game (same-origin iframe) so a
// developer can tune a parameter here and watch it land live, without
// alt-tabbing. Uses the legacy importmap entry (same server this console runs
// on) with ?test=1 to unlock window.__rbTest, which the toolbar calls directly
// via iframe.contentWindow — no postMessage bridge needed, same-origin.
// Parameter live-apply needs NO new plumbing: the game's own `storage` event
// listener already fires for writes from any other same-origin document,
// which an iframe is — the exact mechanism the cross-tab flow already relies on.
// ─────────────────────────────────────────────────────────────────────────────
const PREVIEW_URL = "./first_person_shooter_room_game%20(1).html?test=1";
const PREVIEW_OPEN_KEY = "rb-dev-preview-open";
let pdReadyPoll = null;

function pdSetOpen(open) {
  document.body.classList.toggle("preview-open", open);
  $("#previewToggle").classList.toggle("on", open);
  try { localStorage.setItem(PREVIEW_OPEN_KEY, open ? "1" : "0"); } catch (_) {}
}
$("#previewToggle").onclick = () => pdSetOpen(!document.body.classList.contains("preview-open"));
$("#pdClose").onclick = () => pdSetOpen(false);
if (localStorage.getItem(PREVIEW_OPEN_KEY) === "1") pdSetOpen(true);

// Sidebar collapse toggle (persisted, same pattern as the preview dock).
const SIDEBAR_COLLAPSED_KEY = "rb-dev-sidebar-collapsed";
function setSidebarCollapsed(collapsed) {
  document.body.classList.toggle("sidebar-collapsed", collapsed);
  $("#sidebarToggle").classList.toggle("on", collapsed);
  try { localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? "1" : "0"); } catch (_) {}
}
$("#sidebarToggle").onclick = () => setSidebarCollapsed(!document.body.classList.contains("sidebar-collapsed"));
if (localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "1") setSidebarCollapsed(true);

function pdSetToolbarEnabled(enabled) {
  for (const id of ["pdRestart", "pdWave", "pdJumpWave", "pdGodMode", "pdIntro", "pdBlackout"]) {
    $("#" + id).disabled = !enabled;
  }
}

function pdStart() {
  const frame = $("#pdFrame");
  $("#pdEmpty").style.display = "none";
  frame.style.display = "block";
  frame.src = PREVIEW_URL;
  $("#pdStart").disabled = true;
  $("#pdStop").disabled = false;
  $("#pdStatus").textContent = "Booting…";
  $("#pdStatus").classList.remove("ready");
  pdSetToolbarEnabled(false);
  // Boot takes 15-60s (world/shaders warming) — poll the same readiness flag
  // every Playwright spec in this project already waits on.
  clearInterval(pdReadyPoll);
  pdReadyPoll = setInterval(() => {
    let ready = false;
    try { ready = frame.contentWindow?.document?.body?.dataset?.rbReady === "1"; } catch (_) {}
    if (ready) {
      clearInterval(pdReadyPoll);
      $("#pdStatus").textContent = "● Ready";
      $("#pdStatus").classList.add("ready");
      pdSetToolbarEnabled(true);
    }
  }, 500);
}

function pdStop() {
  clearInterval(pdReadyPoll);
  const frame = $("#pdFrame");
  frame.src = "about:blank"; // tears down the WebGL context + frees memory
  frame.style.display = "none";
  $("#pdEmpty").style.display = "flex";
  $("#pdStart").disabled = false;
  $("#pdStop").disabled = true;
  $("#pdStatus").textContent = "Stopped";
  $("#pdStatus").classList.remove("ready");
  pdSetToolbarEnabled(false);
}

// Every toolbar action reuses an existing __rbTest hook — no new game-side API.
function pdRbTest() {
  try { return $("#pdFrame").contentWindow?.__rbTest || null; } catch (_) { return null; }
}
$("#pdStart").onclick = pdStart;
$("#pdStop").onclick = pdStop;
$("#pdRestart").onclick = () => pdRbTest()?.restart();
$("#pdJumpWave").onclick = () => {
  const rb = pdRbTest(); if (!rb) return;
  const n = Math.max(1, Math.round(Number($("#pdWave").value) || 1));
  rb.setWave(n); rb.completeWave();
};
$("#pdGodMode").onclick = () => pdRbTest()?.setUnlimitedHealth(true);
$("#pdIntro").onclick = () => pdRbTest()?.startIntroCutscene();
$("#pdBlackout").onclick = () => { const rb = pdRbTest(); if (!rb) return; rb.setWaveLighting(10); rb.startBlackoutCutscene(); };

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
function buildAll() {
  const secHost = $("#sections"); secHost.innerHTML = "";
  for (const s of SECTIONS) {
    const div = el("div", { className: "section" });
    div.dataset.sec = s;
    secHost.append(div);
  }
  for (const s of SECTIONS) renderSection(s);
  showSection(activeSection);
}
buildNav();
buildAll();
showSection("presets");
if (_starterJustSeeded) toast("Starter pack installed & activated (Lighting · Camera · Weapons · Player)");
</script>
</body>
